Resources:
  # S3 Bucket for Media Storage (Profile Pictures, Community Images, Post Media, etc.)
  VwanuMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:provider.stage}-vwanu-uploads
      # Enable versioning for data protection (can recover deleted/overwritten files)
      VersioningConfiguration:
        Status: Enabled
      # Server-Side Encryption with AWS-managed keys (SSE-S3)
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256  # AWS-managed encryption, free and automatic
            BucketKeyEnabled: true   # Reduces encryption costs
      # CORS Configuration for direct uploads from frontend
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'  # In production, replace with your specific domain(s)
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      # Public Access Block Settings
      # Allow public read access for media files (profile pictures, posts, etc.)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true        # Block public ACLs on objects
        BlockPublicPolicy: false     # Allow bucket policies to grant public access
        IgnorePublicAcls: true       # Ignore any public ACLs on objects
        RestrictPublicBuckets: false # Allow public bucket policies
      # Lifecycle Rules for cost optimization
      LifecycleConfiguration:
        Rules:
          # Clean up incomplete multipart uploads after 7 days
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Move old versions to cheaper storage after 30 days
          - Id: TransitionOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA  # Infrequent Access (cheaper)
                TransitionInDays: 30
            # Delete old versions after 90 days
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      # Tags for organization
      Tags:
        - Key: Name
          Value: ${self:service}-${self:provider.stage}-media-bucket
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: Purpose
          Value: user-media-storage

  # Bucket Policy for CloudFront or direct access (if needed)
  VwanuMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VwanuMediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow ECS tasks to access the bucket (via IAM role)
          - Sid: AllowECSTaskAccess
            Effect: Allow
            Principal:
              AWS:
                Fn::GetAtt: [ECSTaskRole, Arn]
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !Sub '${VwanuMediaBucket.Arn}/*'
              - !GetAtt VwanuMediaBucket.Arn
          # Allow public read access to all objects (for viewing profile pictures, posts, etc.)
          - Sid: PublicReadAccess
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource:
              - !Sub '${VwanuMediaBucket.Arn}/*'
          # Optional: Add CloudFront origin access identity if you add CDN later
          # - Sid: AllowCloudFrontAccess
          #   Effect: Allow
          #   Principal:
          #     Service: cloudfront.amazonaws.com
          #   Action: s3:GetObject
          #   Resource: !Sub '${VwanuMediaBucket.Arn}/*'
          #   Condition:
          #     StringEquals:
          #       AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}'

Outputs:
  MediaBucketName:
    Description: Name of the S3 bucket for media storage
    Value: !Ref VwanuMediaBucket
    Export:
      Name: ${self:service}-${self:provider.stage}-MediaBucketName

  MediaBucketArn:
    Description: ARN of the S3 bucket for media storage
    Value: !GetAtt VwanuMediaBucket.Arn
    Export:
      Name: ${self:service}-${self:provider.stage}-MediaBucketArn

  MediaBucketDomainName:
    Description: Domain name of the S3 bucket
    Value: !GetAtt VwanuMediaBucket.DomainName
    Export:
      Name: ${self:service}-${self:provider.stage}-MediaBucketDomainName
