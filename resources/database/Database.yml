Resources:
  # Database Security Group (for publicly accessible RDS)
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for publicly accessible RDS PostgreSQL database
      VpcId:
        Ref: VwanuVPC
      SecurityGroupIngress:
        # Allow PostgreSQL access from NAT Gateway (for ECS tasks in private subnets)
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp:
            Fn::Sub: ${VwanuNatEIP}/32
          Description: Allow PostgreSQL from NAT Gateway (ECS tasks)
        # Allow PostgreSQL from anywhere (since database is publicly accessible)
        # You may want to restrict this to specific IPs for security
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Allow PostgreSQL from anywhere
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ${self:service}-${self:provider.stage}-db-sg

  # RDS Database Instance
  VwanuDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: vwanu-api-backend-${sls:stage}
      DBInstanceClass: db.t4g.small
      Engine: postgres
      EngineVersion: 13
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      BackupRetentionPeriod: 30
      MultiAZ: ${self:custom.databaseMultiAz.${sls:stage}}
      EnablePerformanceInsights: true
      PubliclyAccessible: true
      DeletionProtection: false
      MasterUsername: ${self:provider.environment.DB_USERNAME}
      MasterUserPassword: ${self:provider.environment.DB_PASSWORD}
      VPCSecurityGroups:
        - Ref: DatabaseSecurityGroup
